name: fireraccoon_mcp
description: >-
  Model Context Protocol (MCP) server exposing FireRaccoon's Firefly III client
  and projection engine as tools for LLM clients (stdio or local TCP).
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  fireraccoon_engine:
    path: ../engine
  http: ^1.6.0

dev_dependencies:
  test: ^1.31.0
  lints: ^6.0.0
  yaml: ^3.1.3

executables:
  fireraccoon_mcp:
