name: fireracoon_app_backend
description: >-
  FireRacoon server mode: encrypted on-disk app store, multi-user APIs, and
  Firefly III BFF proxy for Docker deployments.
version: 1.0.0
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  crypto: ^3.0.7
  cryptography: ^2.9.0
  fireracoon_engine:
    path: ../engine
  http: ^1.6.0
  path: ^1.9.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.31.0

executables:
  fireracoon_server:
