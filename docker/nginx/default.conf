# Reused TLS connections to the remote API: without keepalive every proxied
# request pays a fresh TCP+TLS handshake (~150ms+).
upstream firefly_remote {
  server cash-api.kodsama.com:443;
  keepalive 8;
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # High-performance static asset file descriptor cache & socket tuning
  open_file_cache max=1000 inactive=60s;
  open_file_cache_valid 60s;
  open_file_cache_min_uses 2;
  open_file_cache_errors on;
  tcp_nopush on;
  tcp_nodelay on;

  # Serve build-time precompressed files when present; fall back to
  # on-the-fly gzip for anything else.
  gzip_static on;
  gzip on;
  gzip_comp_level 6;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types
    text/css
    text/plain
    application/javascript
    application/json
    application/wasm
    application/octet-stream
    image/svg+xml;

  # Proxy Firefly API through same origin to avoid browser CORS limits.
  location /firefly/ {
    proxy_pass https://firefly_remote/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_ssl_server_name on;
    proxy_ssl_name cash-api.kodsama.com;
    proxy_ssl_session_reuse on;
    proxy_set_header Host cash-api.kodsama.com;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  # Same-origin route to the Firefly III container in this compose stack.
  # To use it, set the server URL in Settings to http://localhost:8082/firefly-local
  # with a token from that local instance (~35ms/request vs ~500ms remote).
  # Resolved lazily via Docker's DNS so nginx starts even when the optional
  # firefly-app container is not running (502 on this route instead).
  location /firefly-local/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $firefly_local firefly-app:8080;
    rewrite ^/firefly-local/(.*)$ /$1 break;
    proxy_pass http://$firefly_local;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
  }

  # Entry points and engine files are not content-hashed: force ETag
  # revalidation (cheap 304s) so deploys are picked up immediately and
  # mismatched engine/app versions can never be mixed from cache.
  location ~* ^/(index\.html|flutter_bootstrap\.js|flutter\.js|main\.dart\.js|main\.dart\.wasm|main\.dart\.mjs|flutter_service_worker\.js|version\.json|manifest\.json)$ {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    expires -1;
    try_files $uri =404;
  }
  location /canvaskit/ {
    add_header Cache-Control "no-cache";
  }

  # Static assets (fonts, images, icons) change rarely; cache for a day.
  location /assets/ {
    add_header Cache-Control "public, max-age=86400";
  }
  location /icons/ {
    add_header Cache-Control "public, max-age=86400";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
