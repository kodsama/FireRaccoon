# FireRacoon only — encrypted server mode against an existing Firefly URL.
# Usage: docker compose -f docs/examples/compose.fireracoon-only.yml up -d
services:
  fireracoon:
    image: ghcr.io/kodsama/fireracoon:latest
    # Or build from this repo instead of GHCR:
    # build:
    #   context: ../..
    ports:
      - "127.0.0.1:8082:8080"
    environment:
      FIRERACOON_MODE: server
      DATA_DIR: /data
      DATA_PASSWORD: CHANGE_ME_DATA_PASSWORD
    volumes:
      - fireracoon_data:/data
    restart: unless-stopped

volumes:
  fireracoon_data:
