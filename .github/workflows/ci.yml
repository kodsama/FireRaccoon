name: CI

# Lint + test gate, then multi-platform build matrix (desktop, mobile, web).
# Mirrors the Stunda workflow structure with FireRaccoon-specific setup (.env asset).

on:
  push:
    branches: [main]
  pull_request:

env:
  FLUTTER_VERSION: 3.44.3

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Print toolchain versions
        run: flutter --version

      - name: Prepare CI environment
        run: bash tool/setup-ci-env.sh

      - name: Resolve dependencies
        run: |
          flutter pub get
          ( cd packages/app_backend && dart pub get )

      - name: Format check
        run: >
          dart format --output=none --set-exit-if-changed
          lib test
          packages/engine/lib
          packages/mcp/lib packages/mcp/bin packages/mcp/test
          packages/app_backend/lib packages/app_backend/bin packages/app_backend/test

      - name: Analyze Dart packages
        run: dart analyze packages/engine packages/mcp packages/app_backend

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Test engine package
        working-directory: packages/engine
        run: dart test --coverage=coverage --timeout 3x

      - name: Test MCP package
        working-directory: packages/mcp
        run: dart test --coverage=coverage --timeout 3x

      - name: Test app backend package
        working-directory: packages/app_backend
        run: dart test --coverage=coverage --timeout 3x

      - name: Test Flutter app with coverage
        # Password handling derives a key per call, 600k PBKDF2 rounds. A test
        # doing several, instrumented for coverage and competing with the other
        # isolates, crosses the 30s default and fails on load rather than on
        # what it asserts.
        run: flutter test --coverage --timeout 3x

      - name: Coverage gate
        run: |
          sudo apt-get update && sudo apt-get install -y lcov
          chmod +x tool/check_coverage.sh
          ./tool/check_coverage.sh

  build-desktop:
    name: Build ${{ matrix.target }}
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows
          - os: ubuntu-latest
            target: linux
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Print toolchain versions
        run: flutter --version

      - name: Install Linux build deps
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev \
            libstdc++-12-dev libsecret-1-dev \
            libwebkit2gtk-4.1-dev
          # desktop_webview_window (via flutter_web_auth_2) still looks for the
          # 4.0 pkg-config name; Ubuntu 24.04 only ships 4.1.
          for pc in webkit2gtk javascriptcoregtk; do
            src="/usr/lib/x86_64-linux-gnu/pkgconfig/${pc}-4.1.pc"
            dst="/usr/lib/x86_64-linux-gnu/pkgconfig/${pc}-4.0.pc"
            if [ -f "$src" ] && [ ! -f "$dst" ]; then
              sudo ln -s "$src" "$dst"
            fi
          done

      - name: Prepare CI environment
        run: bash tool/setup-ci-env.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build app
        run: flutter build ${{ matrix.target }} --release

      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: |
            build/macos/Build/Products/Release/*.app
            build/windows/x64/runner/Release/**
            build/linux/x64/release/bundle/**
          if-no-files-found: warn

  build-mobile:
    name: Build ${{ matrix.target }}
    needs: lint-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: apk
          - os: macos-latest
            target: ios
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (Android)
        if: matrix.target == 'apk'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Print toolchain versions
        run: flutter --version

      - name: Use CocoaPods integration on iOS (disable SPM)
        if: matrix.target == 'ios'
        run: flutter config --no-enable-swift-package-manager

      - name: Prepare CI environment
        run: bash tool/setup-ci-env.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Android APK
        if: matrix.target == 'apk'
        run: flutter build apk --debug

      - name: Build iOS (unsigned)
        if: matrix.target == 'ios'
        run: flutter build ios --no-codesign --debug

  build-web:
    name: Build Web
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Print toolchain versions
        run: flutter --version

      - name: Prepare CI environment
        run: bash tool/setup-ci-env.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build Web
        run: flutter build web --release
