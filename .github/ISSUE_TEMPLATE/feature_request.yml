---
name: Feature request
description: Suggest an idea for FireRaccoon
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What problem does this solve? Who benefits?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about

  - type: checkboxes
    id: scope
    attributes:
      label: Area
      options:
        - label: Flutter UI
        - label: packages/engine
        - label: MCP server
        - label: Documentation
        - label: CI / release
